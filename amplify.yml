version: 1
applications:
  - appRoot: apps/studio
    frontend:
      buildPath: '/'
      phases:
        preBuild:
          commands:
            # Install nvm early and make it available system-wide
            # This needs to happen before any tool tries to detect nvm
            - |
              # Install nvm if not available
              if [ ! -d "$HOME/.nvm" ]; then
                curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
              fi
              # Source nvm and add to profile so it's available in all sessions
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              # Add nvm to bashrc and profile for persistence
              if ! grep -q "NVM_DIR" ~/.bashrc; then
                echo 'export NVM_DIR="$HOME/.nvm"' >> ~/.bashrc
                echo '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"' >> ~/.bashrc
                echo '[ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"' >> ~/.bashrc
              fi
              if ! grep -q "NVM_DIR" ~/.profile; then
                echo 'export NVM_DIR="$HOME/.nvm"' >> ~/.profile
                echo '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"' >> ~/.profile
              fi
            # IMPORTANT: AMPLIFY_MONOREPO_APP_ROOT must match appRoot above
            # Set AMPLIFY_MONOREPO_APP_ROOT to 'apps/studio' in Amplify console
            # Extract app name from path for pnpm filter (e.g., 'apps/studio' -> 'studio')
            - |
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              APP_NAME=$(basename ${AMPLIFY_MONOREPO_APP_ROOT:-apps/studio})
              echo "Building app: $APP_NAME (from path: ${AMPLIFY_MONOREPO_APP_ROOT:-apps/studio})"
            # Install and use Node.js 22 (required by package.json engines.node >=22)
            - |
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              # Install and use Node.js 22
              nvm install 22
              nvm use 22
              nvm alias default 22
              echo "Node.js version: $(node --version)"
              echo "npm version: $(npm --version)"
            # Install pnpm using corepack
            - |
              # Ensure nvm is sourced
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              corepack enable
              corepack prepare pnpm@10.18.0 --activate
            # Install dependencies for the entire monorepo
            - |
              # Ensure nvm is sourced
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              # Ensure corepack is enabled
              corepack enable
              # Install all dependencies (this should install for all workspace packages)
              pnpm install --frozen-lockfile
              # Verify installation
              APP_NAME=$(basename ${AMPLIFY_MONOREPO_APP_ROOT:-apps/studio})
              echo "Verifying dependencies for $APP_NAME..."
              # Check if next exists in workspace
              if [ -f "node_modules/.bin/next" ]; then
                echo "✓ Found next in root node_modules/.bin/next"
              elif [ -f "apps/$APP_NAME/node_modules/.bin/next" ]; then
                echo "✓ Found next in apps/$APP_NAME/node_modules/.bin/next"
              else
                echo "✗ next not found, listing node_modules..."
                ls -la node_modules/.bin/ | head -10
              fi
        build:
          commands:
            # Ensure nvm, Node.js 22, and corepack/pnpm are available
            - |
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              nvm use 22
              node --version
              # Enable corepack to make pnpm available
              corepack enable
              corepack prepare pnpm@10.18.0 --activate
              pnpm --version
            # Build the studio app using pnpm workspace filter from root
            - |
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              nvm use 22
              # Ensure corepack is enabled for pnpm
              corepack enable
              # Find and navigate to workspace root (where pnpm-workspace.yaml exists)
              while [ ! -f "pnpm-workspace.yaml" ] && [ "$(pwd)" != "/" ]; do
                cd ..
              done
              if [ ! -f "pnpm-workspace.yaml" ]; then
                echo "ERROR: Could not find workspace root (pnpm-workspace.yaml)"
                exit 1
              fi
              echo "Workspace root: $(pwd)"
              # Install dependencies if node_modules is missing or incomplete
              if [ ! -f "node_modules/.bin/next" ]; then
                echo "Dependencies missing, running pnpm install..."
                pnpm install --frozen-lockfile
              fi
              # Verify next is now available
              if [ ! -f "node_modules/.bin/next" ]; then
                echo "ERROR: next binary still not found after install"
                echo "Checking package.json for next dependency..."
                cat package.json | grep -A 2 '"dependencies"'
                echo "Listing node_modules/.bin contents:"
                ls -la node_modules/.bin/ | head -20
                exit 1
              fi
              echo "✓ Found next at node_modules/.bin/next"
              # Use pnpm filter to build studio with proper workspace context
              pnpm --filter studio run build
      artifacts:
        # For Next.js apps, Amplify handles the build output automatically
        # Since AMPLIFY_MONOREPO_APP_ROOT=studio, this resolves to apps/studio/.next
        baseDirectory: apps/studio/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/studio/.next/cache/**/*
          - apps/studio/node_modules/**/*
          - packages/*/node_modules/**/*
