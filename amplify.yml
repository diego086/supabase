version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Set default app root if not provided via environment variable
        - |
          if [ -z "$AMPLIFY_MONOREPO_APP_ROOT" ]; then
            echo "AMPLIFY_MONOREPO_APP_ROOT not set, defaulting to studio"
            export AMPLIFY_MONOREPO_APP_ROOT=studio
          fi
          echo "App root: $AMPLIFY_MONOREPO_APP_ROOT"
        # Install pnpm if not available
        - corepack enable
        - corepack prepare pnpm@10.18.0 --activate
        # Install dependencies for the entire monorepo
        - pnpm install --frozen-lockfile
    build:
      commands:
        # Build the specific app from the app directory
        # AMPLIFY_MONOREPO_APP_ROOT should be set to 'studio', 'docs', or 'www'
        - |
          APP_NAME=${AMPLIFY_MONOREPO_APP_ROOT:-studio}
          APP_DIR="apps/$APP_NAME"
          echo "Building app: $APP_NAME in directory: $APP_DIR"
          cd $APP_DIR
          pnpm build
          cd ../..
  artifacts:
    # For Next.js apps, Amplify handles the build output automatically
    # The baseDirectory should point to the app directory
    baseDirectory: apps/studio
    files:
      - '.next/**/*'
      - 'public/**/*'
      - 'package.json'
      - 'next.config.js'
  cache:
    paths:
      - node_modules/**/*
      - apps/studio/.next/cache/**/*
      - apps/studio/node_modules/**/*
      - packages/*/node_modules/**/*

