version: 1
applications:
  - appRoot: apps/studio
    frontend:
      buildPath: '/'
      phases:
        preBuild:
          commands:
            # AMPLIFY_MONOREPO_APP_ROOT should be set to 'studio' in Amplify console
            # This ensures we're building the correct app
            - |
              APP_NAME=${AMPLIFY_MONOREPO_APP_ROOT:-studio}
              echo "Building app: $APP_NAME (AMPLIFY_MONOREPO_APP_ROOT=$AMPLIFY_MONOREPO_APP_ROOT)"
            # Install pnpm if not available
            - corepack enable
            - corepack prepare pnpm@10.18.0 --activate
            # Install dependencies for the entire monorepo
            - pnpm install --frozen-lockfile
        build:
          commands:
            # Build the app specified by AMPLIFY_MONOREPO_APP_ROOT (should be 'studio')
            # pnpm filter uses the app name directly, not the path
            - pnpm --filter ${AMPLIFY_MONOREPO_APP_ROOT:-studio} build
      artifacts:
        # For Next.js apps, Amplify handles the build output automatically
        # Since AMPLIFY_MONOREPO_APP_ROOT=studio, this resolves to apps/studio/.next
        baseDirectory: apps/studio/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/studio/.next/cache/**/*
          - apps/studio/node_modules/**/*
          - packages/*/node_modules/**/*
