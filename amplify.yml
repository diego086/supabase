version: 1
applications:
  - appRoot: apps/studio
    frontend:
      buildPath: '/'
      phases:
        preBuild:
          commands:
            # IMPORTANT: AMPLIFY_MONOREPO_APP_ROOT must match appRoot above
            # Set AMPLIFY_MONOREPO_APP_ROOT to 'apps/studio' in Amplify console
            # Extract app name from path for pnpm filter (e.g., 'apps/studio' -> 'studio')
            - |
              APP_NAME=$(basename ${AMPLIFY_MONOREPO_APP_ROOT:-apps/studio})
              echo "Building app: $APP_NAME (from path: ${AMPLIFY_MONOREPO_APP_ROOT:-apps/studio})"
            # Install nvm and Node.js 22 (required by package.json engines.node >=22)
            - |
              # Install nvm if not available
              if [ ! -d "$HOME/.nvm" ]; then
                curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
              fi
              # Source nvm
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
              # Install and use Node.js 22
              nvm install 22
              nvm use 22
              nvm alias default 22
              echo "Node.js version: $(node --version)"
              echo "npm version: $(npm --version)"
            # Install pnpm using corepack
            - |
              # Ensure nvm is sourced
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              corepack enable
              corepack prepare pnpm@10.18.0 --activate
            # Install dependencies for the entire monorepo
            - |
              # Ensure nvm is sourced
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              pnpm install --frozen-lockfile
        build:
          commands:
            # Ensure nvm and Node.js 22 are available
            - |
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              nvm use 22
              node --version
            # Extract app name from AMPLIFY_MONOREPO_APP_ROOT path for pnpm filter
            # If AMPLIFY_MONOREPO_APP_ROOT=apps/studio, this becomes 'studio'
            - |
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              nvm use 22
              APP_NAME=$(basename ${AMPLIFY_MONOREPO_APP_ROOT:-apps/studio})
              pnpm --filter $APP_NAME build
      artifacts:
        # For Next.js apps, Amplify handles the build output automatically
        # Since AMPLIFY_MONOREPO_APP_ROOT=studio, this resolves to apps/studio/.next
        baseDirectory: apps/studio/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/studio/.next/cache/**/*
          - apps/studio/node_modules/**/*
          - packages/*/node_modules/**/*
